name: PHP Syntax Check & phpstan

on:
  pull_request: null
  push:
    branches:
      - master

jobs:
  phpstan-job:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: [7.1, 7.2, 7.3, 7.4, 8.0, 8.1, 8.2, 8.3, 8.4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer

      - name: Syntax Check app
        run: find . -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan for PHP ${{ matrix.php-version }}
        run: vendor/bin/phpstan analyse --no-progress ConnectorOrsr.php
